<h1 id="judul">Selamat Datang</h1>
<h2 id="subjudul">Masukkan nama kamu</h2>

<div class="card">
  <div class="cardini">
    <base
      file="kartu"
      comp="kartu-profil"
      data-nama="John"
      data-pesan="Selamat Hari Raya"
    />
  </div>
  <input id="input" type="text" placeholder="Nama kamu..." />
  <button id="tombol">Kirim</button>
  <button id="tombolToggle">Toggle Mode</button>
  <p class="status" id="status"></p>
</div>
